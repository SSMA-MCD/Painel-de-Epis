<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Fornecedores — SSMA</title>
<style>
  :root{
    --ink:#12213a;
    --ink-soft:#3d4d68;
    --paper:#f3f5f8;
    --card:#ffffff;
    --line:#dde3ec;
    --amber:#e8a13d;
    --amber-deep:#c17f1f;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  header{
    background:var(--ink);
    color:#fff;
    padding:20px 16px 18px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 10px rgba(18,33,58,.15);
  }
  header h1{
    margin:0 0 2px;
    font-size:19px;
    font-weight:700;
    letter-spacing:.2px;
  }
  header p{
    margin:0 0 14px;
    font-size:12.5px;
    color:#aeb9cd;
  }
  .search{
    display:flex;
    align-items:center;
    background:#1c2c4a;
    border:1px solid #2b3e60;
    border-radius:10px;
    padding:9px 12px;
  }
  .search svg{flex:0 0 auto;margin-right:8px;opacity:.6;}
  .search input{
    background:transparent;
    border:none;
    outline:none;
    color:#fff;
    font-size:15px;
    width:100%;
  }
  .search input::placeholder{color:#8b98b3;}
  .chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 16px 4px;
    -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    transition:.15s;
  }
  .chip.active{
    background:var(--amber);
    border-color:var(--amber-deep);
    color:#3a2500;
  }
  .count-bar{
    padding:10px 16px 0;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px;
    padding:14px 16px 40px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .card .thumb{
    background:#f8f9fb;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
  }
  .card .thumb img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }
  .card .info{
    padding:10px 11px 12px;
    border-top:1px solid var(--line);
  }
  .card .tag{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--amber-deep);
    margin-bottom:4px;
  }
  .card .desc{
    font-size:13px;
    font-weight:600;
    line-height:1.3;
    color:var(--ink);
    margin-bottom:4px;
    min-height:34px;
  }
  .card .code{
    font-size:11.5px;
    color:var(--ink-soft);
    font-family:"SF Mono",Consolas,monospace;
  }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  @media (min-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
  }
</style>
</head>
<body>

<header>
  <h1>Book Fornecedores — SSMA</h1>
  <p id="subtitle">carregando...</p>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b98b3" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="searchInput" type="text" placeholder="Buscar por código ou descrição...">
  </div>
</header>

<div class="chips" id="chips"></div>
<div class="count-bar" id="countBar"></div>
<div class="grid" id="grid"></div>

const fornecedores = [...new Set(ITEMS.map(i => i.fornecedor_display))].sort();
let activeFilter = "TODOS";
let searchTerm = "";

const chipsEl = document.getElementById("chips");
const gridEl = document.getElementById("grid");
const countBarEl = document.getElementById("countBar");
const subtitleEl = document.getElementById("subtitle");

subtitleEl.textContent = `${ITEMS.length} itens catalogados · ${fornecedores.length} fornecedores`;

function renderChips(){
  const all = ["TODOS", ...fornecedores];
  chipsEl.innerHTML = all.map(f =>
    `<div class="chip ${f===activeFilter?'active':''}" data-f="${f}">${f}${f!=="TODOS" ? ' ('+ITEMS.filter(i=>i.fornecedor_display===f).length+')' : ''}</div>`
  ).join("");
  chipsEl.querySelectorAll(".chip").forEach(el => {
    el.addEventListener("click", () => {
      activeFilter = el.dataset.f;
      renderChips();
      renderGrid();
    });
  });
}

function renderGrid(){
  const term = searchTerm.trim().toLowerCase();
  const filtered = ITEMS.filter(i => {
    const matchesFilter = activeFilter === "TODOS" || i.fornecedor_display === activeFilter;
    const matchesSearch = !term || i.descricao.toLowerCase().includes(term) || i.codigo.toLowerCase().includes(term);
    return matchesFilter && matchesSearch;
  });

  countBarEl.textContent = `${filtered.length} item${filtered.length===1?'':'s'} encontrado${filtered.length===1?'':'s'}`;

  if(filtered.length === 0){
    gridEl.innerHTML = `<div class="empty" style="grid-column:1/-1">Nenhum item encontrado. Tente outro termo de busca.</div>`;
    return;
  }

  gridEl.innerHTML = filtered.map(i => `
    <div class="card">
      <div class="thumb"><img src="${i.img}" loading="lazy" alt="${i.descricao}"></div>
      <div class="info">
        <span class="tag">${i.fornecedor_display}</span>
        <div class="desc">${i.descricao}</div>
        <div class="code">${i.codigo}</div>
      </div>
    </div>
  `).join("");
}

document.getElementById("searchInput").addEventListener("input", e => {
  searchTerm = e.target.value;
  renderGrid();
});

renderChips();
renderGrid();
</script>
